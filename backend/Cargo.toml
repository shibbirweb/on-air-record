[package]
name = "on-air-record"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Cross platform audio broadcast and DVR service with a browser control room"
authors = ["MD. Shibbir Ahmed <shibbirweb@gmail.com>"]
license = "MIT"
repository = "https://github.com/shibbirweb/on-air-record"
homepage = "https://shibbirweb.github.io"

[dependencies]
axum = { version = "0.8.4", features = ["ws", "macros"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.61", features = ["derive"] }
cpal = "0.16.0"
crossbeam-channel = "0.5.16"
futures-util = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
