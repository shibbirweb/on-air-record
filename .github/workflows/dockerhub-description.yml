# Publishes packaging/DOCKERHUB.md as the description on the image's Docker Hub page.
#
# The Docker Hub page is documentation, so it tracks the docs on master rather than the release cycle: a
# wording change reaches Docker Hub without republishing an image, and a description failure can never
# mark an otherwise successful release as broken. master holds what stable users run, and the page is
# written for them: it names `latest` and fetches the compose file from master, both of which exist from
# 0.8.0 on. Betas never touch master, so they leave the page alone.
#
# It publishes packaging/DOCKERHUB.md rather than README.md, because Docker Hub resolves no relative link
# and renders no mermaid, so the README would arrive with dead links and diagrams as raw source.
#
# Run it by hand from the Actions tab to publish again without a change. Run it on master: another branch
# would publish that branch's page, which may describe what stable users do not have yet.
name: Docker Hub description

on:
  push:
    branches:
      - master
    paths:
      - packaging/DOCKERHUB.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-description
  cancel-in-progress: true

jobs:
  description:
    name: update the Docker Hub page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the page or the credentials are not usable
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets"
            exit 1
          fi
          # Docker Hub refuses a description over 25,000 bytes, with an error that does not say so.
          size="$(wc -c < packaging/DOCKERHUB.md)"
          echo "packaging/DOCKERHUB.md is $size bytes"
          [ "$size" -le 25000 ] || { echo "::error::Docker Hub allows 25000 bytes, and the page is $size"; exit 1; }

      # Editing the description needs a wider token than pushing an image does: Read, Write, Delete, plus
      # Admin on the repository if it belongs to an organisation. A push only token fails here with
      # "Forbidden".
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: shibbirweb/on-air-record
          # Docker Hub's limit here is 100 characters.
          short-description: Record a microphone around the clock and stream it live to browsers on your network
          readme-filepath: packaging/DOCKERHUB.md

      - name: Summary
        run: |
          {
            echo "### Docker Hub description updated"
            echo
            echo "Source: \`packaging/DOCKERHUB.md\` at ${GITHUB_SHA::7}"
            echo
            echo "<https://hub.docker.com/r/shibbirweb/on-air-record>"
          } >> "$GITHUB_STEP_SUMMARY"
