# Finishes the current beta as a stable release: Actions, "Stable release", Run workflow, on develop.
#
# The first of two merges. It moves develop from a published beta, like 0.7.0-beta.1, to its stable
# version, 0.7.0, dates the changelog, and opens a release pull request into develop, like
# `chore:[OAR-90] release 0.7.0`, with the release notes in its description. Merging it is the decision to
# release. Once CI passes on develop, stable-promote.yml opens the develop to master pull request; merging
# that is the second decision, and once CI passes on master, stable-publish.yml publishes the release,
# builds it and installs it on all three platforms.
#
# Every change enters through develop, releases included, which is why this goes to develop and not
# straight to master: a version bump that only master had would leave develop numbering the next beta
# from the old version.
#
# It only finishes a beta that is published and has nothing new since, because anything landed after the
# beta has not been tried by anybody and would go straight to everybody. Cut another beta for that first.
#
# Tick "dry run" to see the version, commit and notes it would use, with nothing pushed or opened. Needs
# the same repository setting as beta.yml: "Allow GitHub Actions to create and approve pull requests".
name: Stable release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run, only show what would happen and push or open nothing
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: read

# One release at a time, betas included.
concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  prepare:
    name: open the release pull request
    runs-on: ubuntu-latest
    steps:
      - name: Only from develop
        if: github.ref != 'refs/heads/develop'
        run: |
          echo "::error::Stable releases are cut from develop, and this was started on ${GITHUB_REF#refs/heads/}. Choose develop under 'Use workflow from'."
          exit 1

      # Full history and tags: version.mjs reads the release tags and the commits since them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - uses: dtolnay/rust-toolchain@stable

      # version.mjs refreshes Cargo.lock with an offline cargo update, which needs the dependencies in the
      # local cache first. A fresh runner has none.
      - name: Fetch the crate dependencies
        working-directory: backend
        run: cargo fetch --locked

      - name: Check CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" \
            --jq '.workflow_runs[0] | if . == null then "none" else (.conclusion // .status) end')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI on ${sha:0:7} is '$conclusion', not a pass. Wait for it to pass on develop, then run this again."
            exit 1
          fi
          echo "CI passed on ${sha:0:7}"

      # Only a beta that people could actually install, and nothing untried on top of it.
      - name: Check there is a finished beta to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(node scripts/version.mjs show)"
          case "$current" in
            *-beta.*) ;;
            *)
              echo "::error::develop is at $current, which is not a beta. A stable release finishes a published beta; run Beta release first."
              exit 1
              ;;
          esac
          if ! git rev-parse --verify --quiet "refs/tags/v$current" > /dev/null; then
            echo "::error::$current has not been published yet. Let Publish beta finish, and try it, before making it stable."
            exit 1
          fi

          # Documentation, tests and tooling do not change what people run, so they need no beta of their
          # own. Anything else, a feat, fix or refactor, does.
          untried="$(git log HEAD --no-merges --format='%h %s' --not --tags='v*' \
            | grep -vE '^[0-9a-f]+ (docs|test|chore)[:[(]' || true)"
          if [ -n "$untried" ]; then
            echo "::error::These landed on develop after v$current was published, so nobody has tried them yet. Run Beta release to put them in a new beta first."
            printf '%s\n' "$untried"
            exit 1
          fi

          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --state open --json headRefName,url \
            --jq '[.[] | select(.headRefName | startswith("release/"))][0].url // ""')"
          if [ -n "$open" ]; then
            echo "::error::A release pull request is already open: $open. Merge or close it first."
            exit 1
          fi

      - name: Finish the beta and date the changelog
        id: bump
        run: |
          node scripts/version.mjs bump release
          version="$(node scripts/version.mjs show)"
          case "$version" in
            *-*) echo "::error::Expected a stable version, got $version."; exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "ticket=$(node scripts/version.mjs next-ticket)"
          } >> "$GITHUB_OUTPUT"

      - name: Release notes from the changelog
        run: |
          # A release with nothing user visible has no section to show; say so rather than fail.
          if ! node scripts/version.mjs notes "${{ steps.bump.outputs.version }}" > "$RUNNER_TEMP/notes.md"; then
            echo '_No user visible changes are recorded in CHANGELOG.md for this version._' > "$RUNNER_TEMP/notes.md"
          fi
          {
            echo "Merging this finishes **${{ steps.bump.outputs.tag }}** as a stable release. It changes the version in"
            echo "the four files that carry it and dates the changelog. Once CI passes on develop, Promote stable"
            echo "opens the pull request from develop into master; merging that publishes the release, builds"
            echo "every platform and installs it on macOS, Linux and Windows."
            echo ''
            echo 'Close it instead to cancel; nothing is published until both pull requests are merged.'
            echo ''
            echo '## Release notes'
            echo ''
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/body.md"
          {
            echo "### ${{ steps.bump.outputs.tag }}${{ inputs.dry_run && ' (dry run, nothing pushed or opened)' || '' }}"
            echo ''
            echo "Commit: \`chore:[OAR-${{ steps.bump.outputs.ticket }}] release ${{ steps.bump.outputs.version }}\`"
            echo ''
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the release branch
        if: ${{ !inputs.dry_run }}
        run: |
          branch="release/${{ steps.bump.outputs.tag }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "chore:[OAR-${{ steps.bump.outputs.ticket }}] release ${{ steps.bump.outputs.version }}"
          git push origin "$branch"

      - name: Open the release pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="chore:[OAR-${{ steps.bump.outputs.ticket }}] release ${{ steps.bump.outputs.version }}"
          if ! url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base develop \
                --head "release/${{ steps.bump.outputs.tag }}" --title "$title" --body-file "$RUNNER_TEMP/body.md" 2>&1)"; then
            echo "$url"
            echo "::error::GitHub would not open the pull request. If it says Actions may not create pull requests, tick Settings, Actions, General, 'Allow GitHub Actions to create and approve pull requests', delete the release/${{ steps.bump.outputs.tag }} branch, and run this again."
            exit 1
          fi
          echo "Opened $url"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release pull request: $url" >> "$GITHUB_STEP_SUMMARY"
