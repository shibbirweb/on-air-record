# Every push is built and tested on the three platforms the service claims to support.
#
# The Windows job exists specifically because it cannot be run from a developer machine: bundled SQLite
# needs a Windows C toolchain, so cross compiling fails and only a real runner settles whether the claim
# holds.
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# A new push makes an in flight run of the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Backtraces cost nothing here and turn a bare assertion failure into something readable.
  RUST_BACKTRACE: 1

jobs:
  # The version lives in four files and means one thing. This is what stops them separating, and it costs
  # seconds because the check only reads them: no cargo, no npm install, no matrix.
  versions:
    name: versions agree
    runs-on: ubuntu-latest
    steps:
      # Tags and full history, because the release report below works out what is unreleased with
      # `git describe`, and a shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - run: node scripts/version.mjs check

      # Answers "is a release due?" on every run without anybody having to remember to ask. It is a note
      # in the run summary, not a rule: work waiting to be released is normal and never a build failure.
      - name: Report whether a release is due
        run: |
          {
            echo '### Release status'
            echo ''
            echo '```'
            node scripts/version.mjs pending
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others are fine, which is the whole point of
      # running all three.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # cpal links against ALSA on Linux. macOS has CoreAudio and Windows has WASAPI in the SDK, so
      # neither needs anything installed.
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Also type checks, because the build script runs tsc first.
      - name: Build
        run: npm run build

  # The installers are the only code most people will ever run, and they cannot be tested by compiling
  # them. This installs from the latest published release on all three platforms, exactly as a user would,
  # and then checks the service it produced actually answers.
  #
  # The scripts come from the checkout, not from raw.githubusercontent, so a pull request tests its own
  # version rather than the one already on master.
  installers:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      # The released Linux binary loads ALSA at run time. A runner image may not carry it.
      - name: Install the ALSA runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          work="$RUNNER_TEMP/installer-test"
          mkdir -p "$work"
          cd "$work"

          echo "::group::install"
          sh "$GITHUB_WORKSPACE/scripts/install.sh" --port 8099 --no-start
          echo "::endgroup::"

          for file in on-air-record/on-air-record on-air-record/start.sh on-air-record/config; do
            test -f "$file" || { echo "missing $file"; exit 1; }
          done
          test -d on-air-record/data || { echo "missing the data folder"; exit 1; }
          grep -q '^OAR_PORT=8099$' on-air-record/config || { echo "port was not saved"; exit 1; }
          echo "layout and config OK"

          # A downloaded binary that will not execute is the failure this job exists to catch, and on macOS
          # it is also proof that curl left no quarantine flag behind.
          version="$(./on-air-record/on-air-record --version)"
          echo "installed: $version"
          case "$version" in
            "on-air-record "[0-9]*) ;;
            *) echo "unexpected --version output"; exit 1 ;;
          esac

          echo "::group::start via the launcher"
          ./on-air-record/start.sh > service.log 2>&1 &
          answered=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8099/api/health -o health.json 2>/dev/null; then answered=1; break; fi
            sleep 1
          done
          echo "::endgroup::"

          if [ "$answered" -ne 1 ]; then
            echo "the service never answered on the configured port"
            cat service.log || true
            pkill -f 'on-air-record/on-air-record' 2>/dev/null || true
            exit 1
          fi
          cat health.json; echo
          grep -q '"status":"ok"' health.json || { echo "health did not report ok"; exit 1; }
          test -f on-air-record/data/on-air-record.sqlite || { echo "the database was not created in the folder"; exit 1; }
          echo "the launcher started it on the configured port, with its data inside the folder"

          # Stopping is the other half of running, and the script that does it is the one a user reaches
          # for once their terminal is gone. Exercise it rather than reaching for pkill here.
          echo "::group::stop via the script"
          ./on-air-record/stop.sh
          echo "::endgroup::"
          if curl -fsS --max-time 2 http://127.0.0.1:8099/api/health > /dev/null 2>&1; then
            echo "stop.sh returned but the service is still answering"
            pkill -f 'on-air-record/on-air-record' 2>/dev/null || true
            exit 1
          fi
          echo "stop.sh shut it down and freed the port"

          # Saying so plainly beats failing, since there is nothing wrong with stopping what is stopped.
          ./on-air-record/stop.sh | grep -q 'Nothing is running' || { echo "a second stop should be a no-op"; exit 1; }
          echo "a second stop is a no-op"

          echo "::group::second run"
          second="$(sh "$GITHUB_WORKSPACE/scripts/install.sh" --no-start)"
          echo "$second"
          echo "::endgroup::"
          echo "$second" | grep -q "Already installed here" || { echo "it downloaded again instead of reusing the install"; exit 1; }
          echo "$second" | grep -q "Using the settings already saved" || { echo "it did not reuse the saved config"; exit 1; }

          # No port given and no terminal to ask at: the default has to stand rather than hanging.
          mkdir -p "$work/fresh" && cd "$work/fresh"
          sh "$GITHUB_WORKSPACE/scripts/install.sh" --no-start < /dev/null > /dev/null
          grep -q '^OAR_PORT=8080$' on-air-record/config || { echo "the non interactive default was not used"; exit 1; }
          echo "non interactive run fell back to the default port"

      # Windows PowerShell 5.1 on purpose: it is what a Windows machine has out of the box, it negotiates
      # TLS 1.0 by default, and it is where the checksum file arrives as a byte array.
      - name: install.ps1 on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'installer-test'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Set-Location $work

          Write-Host '::group::install'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\install.ps1" -Port 8099 -NoStart
          if ($LASTEXITCODE -ne 0) { throw "the installer exited with $LASTEXITCODE" }
          Write-Host '::endgroup::'

          foreach ($file in @('on-air-record\on-air-record.exe', 'on-air-record\start.cmd', 'on-air-record\start.ps1', 'on-air-record\config')) {
            if (-not (Test-Path $file)) { throw "missing $file" }
          }
          if (-not (Test-Path 'on-air-record\data')) { throw 'missing the data folder' }
          if (-not (Select-String -Path 'on-air-record\config' -Pattern '^OAR_PORT=8099$' -Quiet)) { throw 'port was not saved' }
          Write-Host 'layout and config OK'

          $version = & '.\on-air-record\on-air-record.exe' --version
          Write-Host "installed: $version"
          if ($version -notmatch '^on-air-record \d') { throw "unexpected --version output: $version" }

          Write-Host '::group::start via start.cmd'
          $service = Start-Process -FilePath '.\on-air-record\start.cmd' -PassThru -NoNewWindow `
            -RedirectStandardOutput service.log -RedirectStandardError service.err
          $health = $null
          foreach ($attempt in 1..60) {
            try {
              $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8099/api/health' -TimeoutSec 2
              break
            } catch { Start-Sleep -Seconds 1 }
          }
          # start.cmd spawns powershell which spawns the program, so stopping the launcher is not enough.
          # stop.cmd is what a user reaches for, so use it rather than reaching straight for Stop-Process.
          & '.\on-air-record\stop.cmd'
          Stop-Process -Id $service.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'on-air-record' -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host '::endgroup::'

          if (-not $health) {
            Get-Content service.log, service.err -ErrorAction SilentlyContinue | Write-Host
            throw 'the service never answered on the configured port'
          }
          Write-Host ($health | ConvertTo-Json -Compress)
          if ($health.status -ne 'ok') { throw "health did not report ok: $($health.status)" }
          if (-not (Test-Path 'on-air-record\data\on-air-record.sqlite')) { throw 'the database was not created in the folder' }
          Write-Host 'start.cmd started it on the configured port, with its data inside the folder'

          # Saying so plainly beats failing, since there is nothing wrong with stopping what is stopped.
          $again = & '.\on-air-record\stop.cmd' | Out-String
          if ($again -notmatch 'Nothing is running') { throw "a second stop should be a no-op, got: $again" }
          Write-Host 'a second stop is a no-op'

          Write-Host '::group::second run'
          $second = & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\install.ps1" -NoStart | Out-String
          Write-Host $second
          Write-Host '::endgroup::'
          if ($second -notmatch 'Already installed here') { throw 'it downloaded again instead of reusing the install' }
          if ($second -notmatch 'Using the settings already saved') { throw 'it did not reuse the saved config' }

      # PowerShell 7 is a different engine, and anybody who has installed it will use it by reflex.
      - name: install.ps1 on PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'installer-test-pwsh'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Set-Location $work

          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\scripts\install.ps1" -Port 8098 -NoStart
          if ($LASTEXITCODE -ne 0) { throw "the installer exited with $LASTEXITCODE" }

          if (-not (Test-Path 'on-air-record\on-air-record.exe')) { throw 'the program was not installed' }
          if (-not (Select-String -Path 'on-air-record\config' -Pattern '^OAR_PORT=8098$' -Quiet)) { throw 'port was not saved' }
          Write-Host "installed: $(& '.\on-air-record\on-air-record.exe' --version)"
