# Builds a downloadable binary per platform when a version tag is pushed.
#
# Each archive holds one executable with the web UI compiled into it, so running the service on a new
# machine is download, extract, run.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Useful for rehearsing the build without cutting a release: artifacts are produced, nothing is published.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The version comes from the manifest, never from the tag. A tag is just a label somebody typed, and one
  # that disagreed with the code would ship an archive called v0.3.0 holding a binary that reports v0.1.0
  # in its own footer, with nothing to catch it.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      artifact_tag: ${{ steps.resolve.outputs.artifact_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check every manifest agrees
        run: python3 scripts/version.py check

      - name: Resolve the version to build
        id: resolve
        run: |
          version="$(python3 scripts/version.py show)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match backend/Cargo.toml, which says $version." \
                   "Either tag v$version, or run 'python3 scripts/version.py set <version>', commit, and retag."
              exit 1
            fi
            echo "artifact_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "releasing $GITHUB_REF_NAME"
          else
            # A rehearsal off a branch. Naming it after the branch would produce an identical filename on
            # every run and read as though 'master' were a version.
            tag="v$version-dev-$(git rev-parse --short HEAD)"
            echo "artifact_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "rehearsing $tag, nothing will be published"
          fi

  # Built once and shared, so every platform ships byte identical assets rather than four separate builds
  # that merely ought to match.
  ui:
    name: web ui
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: frontend/dist
          retention-days: 1

  binary:
    name: ${{ matrix.target }}
    needs: [version, ui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Must land before cargo build, because a release build reads this directory at compile time and
      # embeds whatever it finds.
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: frontend/dist

      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Build
        working-directory: backend
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        if: runner.os != 'Windows'
        run: |
          name="on-air-record-${{ needs.version.outputs.artifact_tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "backend/target/${{ matrix.target }}/release/on-air-record" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          # The systemd unit is only useful on Linux, so it does not belong in the macOS archives.
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp packaging/on-air-record.service "dist/$name/"
          fi
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          if command -v sha256sum > /dev/null; then
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "on-air-record-${{ needs.version.outputs.artifact_tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "backend/target/${{ matrix.target }}/release/on-air-record.exe" "dist/$name/"
          Copy-Item "README.md" "dist/$name/"
          Copy-Item "LICENSE" "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    name: publish
    needs: binary
    runs-on: ubuntu-latest
    # Only a tag becomes a release. A manual run stops at the artifacts above.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
