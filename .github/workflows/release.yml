# Builds a downloadable binary per platform and attaches it to a release.
#
# Each archive holds one executable with the web UI compiled into it, so running the service on a new
# machine is download, extract, run. The same release is also pushed as a container image for Linux
# hosts, to ghcr.io, by the image jobs at the end.
#
# Releases are cut from the GitHub web interface: Releases, Draft a new release, pick or create the tag,
# Publish. That publish is what starts this. Notes written there are kept. Notes left empty, or filled with
# GitHub's generated list of pull requests, are replaced with the version's section of CHANGELOG.md, because
# that is what the running app shows admins as What's new.
#
# Betas go the same way, from develop, with a version like 0.4.0-beta.1 and "Set as a pre-release" ticked.
# GitHub never counts a pre-release as the latest release, so the installers keep handing stable users the
# last stable version, and only somebody who asks for --beta gets one.
name: Release

on:
  release:
    types: [published]
  # Useful for rehearsing the build without cutting a release: artifacts are produced, nothing is published.
  workflow_dispatch:
  # How beta-publish.yml hands over a release it has just published. It has to call this rather than wait
  # for the "published" event, because GitHub starts no workflow for anything done with the built in token,
  # which is what beta-publish.yml publishes with.
  workflow_call:
    inputs:
      tag:
        description: The already published release to build and attach files to, like v0.4.0-beta.1
        type: string
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Lowercase, as registries insist, and matching IMAGE and DOCKER_HUB_IMAGE in
  # frontend/src/lib/updateSteps.ts, which tell admins what to pull. ghcr.io is the one the docs lead with,
  # because it has no pull rate limit; Docker Hub carries the same image for people who look there first.
  IMAGE: ghcr.io/shibbirweb/on-air-record
  DOCKERHUB_IMAGE: docker.io/shibbirweb/on-air-record

jobs:
  # The version comes from the manifest, never from the tag. A tag is just a label somebody typed, and one
  # that disagreed with the code would ship an archive called v0.3.0 holding a binary that reports v0.1.0
  # in its own footer, with nothing to catch it.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      artifact_tag: ${{ steps.resolve.outputs.artifact_tag }}
      # True for a real release, which gets files attached and is then installed to prove it works. False
      # for a rehearsal. An output rather than a check on the event name, because a called workflow sees
      # its caller's event.
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      # Called by beta-publish.yml, check out the tag it just made; otherwise the default, which for a
      # published release is its tag already. Every checkout below does the same.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Check every manifest agrees
        run: node scripts/version.mjs check

      - name: Resolve the version to build
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node scripts/version.mjs show)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A called run has no release event to read the flag from, so ask the release itself.
          if [ -n "$RELEASE_TAG" ] && [ -z "$RELEASE_PRERELEASE" ]; then
            RELEASE_PRERELEASE="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          fi

          if [ -n "$RELEASE_TAG" ]; then
            if [ "$RELEASE_TAG" != "v$version" ]; then
              echo "::error::The release is tagged $RELEASE_TAG but backend/Cargo.toml says $version." \
                   "Either tag it v$version, or run 'node scripts/version.mjs set <version>', commit," \
                   "then delete the release and its tag and create it again."
              exit 1
            fi

            # The version decides the channel, and the release has to agree. A beta published as a normal
            # release would become "latest", which is what the installers hand to everybody; a stable
            # version published as a pre-release would be hidden from them.
            case "$version" in
              *-*)
                if [ "$RELEASE_PRERELEASE" != "true" ]; then
                  echo "::error::v$version is a beta, but the release is not marked as a pre-release." \
                       "Edit the release, tick 'Set as a pre-release', and publish it again."
                  exit 1
                fi
                ;;
              *)
                if [ "$RELEASE_PRERELEASE" = "true" ]; then
                  echo "::error::v$version is a stable version, but the release is marked as a" \
                       "pre-release. Untick 'Set as a pre-release', or give it a beta version such as" \
                       "$version-beta.1."
                  exit 1
                fi
                ;;
            esac

            echo "artifact_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "building $RELEASE_TAG"
          else
            # A rehearsal off a branch. Naming it after the branch would produce an identical filename on
            # every run and read as though 'master' were a version.
            tag="v$version-dev-$(git rev-parse --short HEAD)"
            echo "artifact_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "rehearsing $tag, nothing will be published"
          fi

  # The release notes are what the app shows admins as What's new, so they must be the changelog written
  # for people running it, not GitHub's generated list of pull request titles. Stable releases were being
  # published with the generated list, so this fills in the changelog section when the notes are empty or
  # generated, and leaves anything written by hand alone. Betas already carry theirs from beta-publish.yml.
  #
  # After the files are attached rather than alongside, because attaching them rewrites the release, and
  # one that read the notes first could put the generated ones back.
  notes:
    name: release notes
    needs: [version, publish]
    runs-on: ubuntu-latest
    if: needs.version.outputs.publish == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Fill in empty or generated notes from the changelog
        env:
          TAG: ${{ needs.version.outputs.artifact_tag }}
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [ -n "$current" ] && ! printf '%s\n' "$current" | grep -qE '^## What.s Changed|^\*\*Full Changelog\*\*'; then
            echo "keeping the notes written on the release"
            exit 0
          fi

          # A beta is published from the unreleased section; a stable version has its own dated one.
          case "$VERSION" in
            *-*) found() { node scripts/version.mjs notes > notes.md; } ;;
            *) found() { node scripts/version.mjs notes "$VERSION" > notes.md; } ;;
          esac
          # Missing notes are worth a warning, not a failed release: the files still matter more.
          if ! found; then
            echo "::warning::CHANGELOG.md has no section for $VERSION, so the release notes were left as they are."
            exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          echo "release notes set from CHANGELOG.md"

  # Built once and shared, so every platform ships byte identical assets rather than four separate builds
  # that merely ought to match.
  ui:
    name: web ui
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: frontend/dist
          retention-days: 1

  binary:
    name: ${{ matrix.target }}
    needs: [version, ui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # Must land before cargo build, because a release build reads this directory at compile time and
      # embeds whatever it finds.
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: frontend/dist

      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Build
        working-directory: backend
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        if: runner.os != 'Windows'
        run: |
          name="on-air-record-${{ needs.version.outputs.artifact_tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "backend/target/${{ matrix.target }}/release/on-air-record" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          # The systemd unit is only useful on Linux, so it does not belong in the macOS archives.
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp packaging/on-air-record.service "dist/$name/"
          fi
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          if command -v sha256sum > /dev/null; then
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "on-air-record-${{ needs.version.outputs.artifact_tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "backend/target/${{ matrix.target }}/release/on-air-record.exe" "dist/$name/"
          Copy-Item "README.md" "dist/$name/"
          Copy-Item "LICENSE" "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    name: attach to the release
    needs: [version, binary]
    runs-on: ubuntu-latest
    # Only a published release gets files attached. A manual rehearsal stops at the artifacts above.
    if: needs.version.outputs.publish == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      # The release already exists, made by hand, so this only uploads the files onto it. It never
      # touches the notes; the notes job above looks after them.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.artifact_tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  # The last word on whether the release is usable: install it the way a person would, on each platform,
  # from the files that were just attached, and check the service comes up.
  #
  # This runs after publishing rather than before, because there is nothing to install until the assets
  # exist. A failure here means the release is already public and broken, which is worth knowing loudly:
  # fix it, delete the release and its tag, and cut it again.
  verify:
    name: verify the install (${{ matrix.os }})
    needs: [version, publish]
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install the ALSA runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install and run this release
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.artifact_tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          work="$RUNNER_TEMP/verify"
          mkdir -p "$work"
          cd "$work"

          # Pinned to the tag rather than resolving "latest", so this cannot quietly test the previous
          # release while GitHub is still catching up.
          sh "$GITHUB_WORKSPACE/scripts/install.sh" --release "$RELEASE_TAG" --port 8099 --no-start

          reported="$(./on-air-record/on-air-record --version | awk '{print $2}')"
          echo "the archive is named $RELEASE_TAG and the binary inside reports $reported"
          if [ "$reported" != "$RELEASE_VERSION" ]; then
            echo "the released binary disagrees with the tag it shipped under"
            exit 1
          fi

          ./on-air-record/start.sh > service.log 2>&1 &
          answered=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8099/api/health -o health.json 2>/dev/null; then answered=1; break; fi
            sleep 1
          done
          pkill -f 'on-air-record/on-air-record' 2>/dev/null || true

          if [ "$answered" -ne 1 ]; then
            echo "the released service never answered"
            cat service.log || true
            exit 1
          fi
          cat health.json; echo
          grep -q "\"version\":\"$RELEASE_VERSION\"" health.json || { echo "health reported the wrong version"; exit 1; }
          echo "release verified end to end on $(uname -s)"

      - name: Install and run this release
        if: runner.os == 'Windows'
        shell: powershell
        env:
          RELEASE_TAG: ${{ needs.version.outputs.artifact_tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'verify'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Set-Location $work

          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\install.ps1" `
            -Release $env:RELEASE_TAG -Port 8099 -NoStart
          if ($LASTEXITCODE -ne 0) { throw "the installer exited with $LASTEXITCODE" }

          $reported = (& '.\on-air-record\on-air-record.exe' --version) -split '\s+' | Select-Object -Last 1
          Write-Host "the archive is named $env:RELEASE_TAG and the binary inside reports $reported"
          if ($reported -ne $env:RELEASE_VERSION) {
            throw "the released binary disagrees with the tag it shipped under"
          }

          $service = Start-Process -FilePath '.\on-air-record\start.cmd' -PassThru -NoNewWindow `
            -RedirectStandardOutput service.log -RedirectStandardError service.err
          $health = $null
          foreach ($attempt in 1..60) {
            try {
              $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8099/api/health' -TimeoutSec 2
              break
            } catch { Start-Sleep -Seconds 1 }
          }
          Stop-Process -Id $service.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'on-air-record' -ErrorAction SilentlyContinue | Stop-Process -Force

          if (-not $health) {
            Get-Content service.log, service.err -ErrorAction SilentlyContinue | Write-Host
            throw 'the released service never answered'
          }
          Write-Host ($health | ConvertTo-Json -Compress)
          if ($health.version -ne $env:RELEASE_VERSION) { throw "health reported the wrong version" }
          Write-Host 'release verified end to end on Windows'

  # The container image, for Linux hosts. Built from the Dockerfile rather than from the binaries above, so
  # `docker build` on a checkout makes exactly what is published. One native runner per architecture,
  # because compiling Rust under emulation takes most of an hour. Each pushes its image by digest alone,
  # with no tag, and the job after joins the two under the version's tags, so a half finished run never
  # moves `latest` to an image for only one architecture.
  #
  # arm64 is here even though no arm64 archive is: a Raspberry Pi with a 64 bit OS gets a ready made build
  # this way, where the archives would have it build from source.
  #
  # Docker Hub needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets. Without them the image
  # still goes to ghcr.io and the tagging job warns, so a release never fails over the second registry.
  image:
    name: image (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/login-action@v3
        if: env.DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One build pushed to both registries. The digest is the same in each, so the tagging job needs only
      # the one list.
      - name: Choose the registries
        id: registries
        run: |
          if [ "$DOCKERHUB" = "true" ]; then
            echo "names=$IMAGE,$DOCKERHUB_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "names=$IMAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.version=${{ needs.version.outputs.version }}
          outputs: type=image,"name=${{ steps.registries.outputs.names }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Keep the digest for the tagging job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags follow the channels the installers have. `latest` is the newest stable release, what somebody who
  # asks for nothing in particular should get. `beta` is the newest release of any kind, like --beta, so a
  # stable release moves it too; that never steps back, because a stable release is only ever cut from a
  # published beta of the same version. A stable release also gets its minor line, like 0.7, for anybody
  # who wants fixes but not features.
  image-tags:
    name: image tags
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    # Handed to verify-image, so it checks exactly what was tagged rather than working it out again.
    outputs:
      tags: ${{ steps.tag.outputs.tags }}
      images: ${{ steps.tag.outputs.images }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/login-action@v3
        if: env.DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag both architectures under the version
        id: tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          case "$VERSION" in
            *-*) tags="$VERSION beta" ;;
            *) tags="$VERSION ${VERSION%.*} latest beta" ;;
          esac
          if [ "$DOCKERHUB" = "true" ]; then
            images="$IMAGE $DOCKERHUB_IMAGE"
          else
            images="$IMAGE"
            echo "::warning::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set, so this release went to ghcr.io only, not Docker Hub."
          fi
          for image in $images; do
            set --
            for tag in $tags; do set -- "$@" --tag "$image:$tag"; done
            for digest in "$RUNNER_TEMP"/digests/*; do set -- "$@" "$image@sha256:$(basename "$digest")"; done
            docker buildx imagetools create "$@"
            docker buildx imagetools inspect "$image:$VERSION"
          done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # The last word on the image, as the verify job is on the archives, and on each architecture's own
  # hardware, since an arm64 image that pulls but will not start is exactly what a Raspberry Pi user would
  # meet. It never signs in: the tagging job did, and a signed in pull succeeds against a package that is
  # still private, which is how GitHub publishes every new package. Everything here is what somebody
  # following the setup guide does: pull each tag from each registry, run it with a sound card passed
  # through as the guide says, and check it answers, hears the card, and stops cleanly.
  #
  # Like verify, this runs after publishing, so a failure means the release is out and its image is not
  # usable as documented. The first image ever published fails here until the ghcr.io package is made
  # public, and says so; that failure is the point.
  verify-image:
    name: verify the image (${{ matrix.arch }})
    needs: [version, image-tags]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAGS: ${{ needs.image-tags.outputs.tags }}
      IMAGES: ${{ needs.image-tags.outputs.images }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Pull every tag anonymously
        run: |
          set -eu
          # A fresh runner holds no credentials, but make sure of it, since this step means nothing
          # otherwise.
          docker logout ghcr.io > /dev/null 2>&1 || true
          docker logout > /dev/null 2>&1 || true

          for image in $IMAGES; do
            if ! docker pull "$image:$VERSION"; then
              case "$image" in
                ghcr.io/*)
                  echo "::error::$image:$VERSION cannot be pulled without signing in. GitHub publishes every new package as private: open https://github.com/users/shibbirweb/packages/container/on-air-record/settings, Change visibility, Public, then re-run this job."
                  ;;
                *)
                  echo "::error::$image:$VERSION cannot be pulled without signing in. Check the repository exists on Docker Hub and is public."
                  ;;
              esac
              exit 1
            fi
            expected="$(docker buildx imagetools inspect "$image:$VERSION" --format '{{.Manifest.Digest}}')"
            for tag in $TAGS; do
              found="$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')"
              [ "$found" = "$expected" ] || { echo "::error::$image:$tag points at $found, not the $VERSION image $expected"; exit 1; }
              echo "$image:$tag -> $found"
            done
          done

          # Every registry has to hold the one image, not merely one with the same tag.
          digests="$(for image in $IMAGES; do docker buildx imagetools inspect "$image:$VERSION" --format '{{.Manifest.Digest}}'; done | sort -u | wc -l)"
          [ "$digests" -eq 1 ] || { echo "::error::the registries hold different images under $VERSION"; exit 1; }

      # The runner has no sound card; the kernel's loopback card stands in, as in CI. A runner that cannot
      # load it is a warning, because the image is not what is broken then.
      - name: Load a loopback sound card
        id: card
        run: |
          if sudo modprobe snd-aloop 2>/dev/null \
             || { sudo apt-get update > /dev/null \
                  && sudo apt-get install -y "linux-modules-extra-$(uname -r)" > /dev/null \
                  && sudo modprobe snd-aloop; }; then
            ls -ln /dev/snd
            echo "loaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::This runner could not load snd-aloop, so the published image ran without a sound card on ${{ matrix.arch }}."
            echo "loaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run it from each registry, as the setup guide does
        env:
          CARD: ${{ steps.card.outputs.loaded }}
        run: |
          set -eu
          for image in $IMAGES; do
            echo "::group::$image:$VERSION"
            set -- -d --name on-air-record -p 8099:8080 --stop-timeout 30 -e TZ=Europe/London
            if [ "$CARD" = "true" ]; then
              # The same two flags the guide gives, with the number read from the devices the same way.
              set -- "$@" --device /dev/snd --group-add "$(stat -c %g /dev/snd/timer)"
            fi
            docker run "$@" "$image:$VERSION"

            answered=0
            for _ in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8099/api/health -o health.json 2>/dev/null; then answered=1; break; fi
              sleep 1
            done
            if [ "$answered" -ne 1 ]; then
              docker logs on-air-record || true
              echo "::error::$image:$VERSION never answered on ${{ matrix.arch }}"
              exit 1
            fi
            cat health.json; echo
            grep -q "\"version\":\"$VERSION\"" health.json || { echo "::error::$image:$VERSION reports another version"; exit 1; }
            curl -fsS http://127.0.0.1:8099/api/updates | grep -q '"kind":"docker"' \
              || { echo "::error::$image does not report itself as a container"; exit 1; }
            docker exec on-air-record on-air-record health
            [ "$(docker exec on-air-record id -u)" = "10001" ] || { echo "::error::$image runs as the wrong user"; exit 1; }

            if [ "$CARD" = "true" ]; then
              devices="$(curl -fsS http://127.0.0.1:8099/api/devices)"
              echo "$devices"
              echo "$devices" | grep -q 'Loopback' \
                || { docker logs on-air-record; echo "::error::the sound card passed in is not offered as a microphone by $image"; exit 1; }
            fi

            docker stop on-air-record > /dev/null
            code="$(docker inspect --format '{{.State.ExitCode}}' on-air-record)"
            docker rm on-air-record > /dev/null
            [ "$code" = "0" ] || { echo "::error::$image stopped with exit code $code"; exit 1; }
            echo "::endgroup::"
            echo "$image:$VERSION verified on ${{ matrix.arch }}"
          done
