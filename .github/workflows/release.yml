# Builds a downloadable binary per platform and attaches it to a release.
#
# Each archive holds one executable with the web UI compiled into it, so running the service on a new
# machine is download, extract, run.
#
# Releases are cut from the GitHub web interface: Releases, Draft a new release, pick or create the tag,
# Publish. That publish is what starts this. Notes written there are kept. Notes left empty, or filled with
# GitHub's generated list of pull requests, are replaced with the version's section of CHANGELOG.md, because
# that is what the running app shows admins as What's new.
#
# Betas go the same way, from develop, with a version like 0.4.0-beta.1 and "Set as a pre-release" ticked.
# GitHub never counts a pre-release as the latest release, so the installers keep handing stable users the
# last stable version, and only somebody who asks for --beta gets one.
name: Release

on:
  release:
    types: [published]
  # Useful for rehearsing the build without cutting a release: artifacts are produced, nothing is published.
  workflow_dispatch:
  # How beta-publish.yml hands over a release it has just published. It has to call this rather than wait
  # for the "published" event, because GitHub starts no workflow for anything done with the built in token,
  # which is what beta-publish.yml publishes with.
  workflow_call:
    inputs:
      tag:
        description: The already published release to build and attach files to, like v0.4.0-beta.1
        type: string
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The version comes from the manifest, never from the tag. A tag is just a label somebody typed, and one
  # that disagreed with the code would ship an archive called v0.3.0 holding a binary that reports v0.1.0
  # in its own footer, with nothing to catch it.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      artifact_tag: ${{ steps.resolve.outputs.artifact_tag }}
      # True for a real release, which gets files attached and is then installed to prove it works. False
      # for a rehearsal. An output rather than a check on the event name, because a called workflow sees
      # its caller's event.
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      # Called by beta-publish.yml, check out the tag it just made; otherwise the default, which for a
      # published release is its tag already. Every checkout below does the same.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Check every manifest agrees
        run: node scripts/version.mjs check

      - name: Resolve the version to build
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node scripts/version.mjs show)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A called run has no release event to read the flag from, so ask the release itself.
          if [ -n "$RELEASE_TAG" ] && [ -z "$RELEASE_PRERELEASE" ]; then
            RELEASE_PRERELEASE="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          fi

          if [ -n "$RELEASE_TAG" ]; then
            if [ "$RELEASE_TAG" != "v$version" ]; then
              echo "::error::The release is tagged $RELEASE_TAG but backend/Cargo.toml says $version." \
                   "Either tag it v$version, or run 'node scripts/version.mjs set <version>', commit," \
                   "then delete the release and its tag and create it again."
              exit 1
            fi

            # The version decides the channel, and the release has to agree. A beta published as a normal
            # release would become "latest", which is what the installers hand to everybody; a stable
            # version published as a pre-release would be hidden from them.
            case "$version" in
              *-*)
                if [ "$RELEASE_PRERELEASE" != "true" ]; then
                  echo "::error::v$version is a beta, but the release is not marked as a pre-release." \
                       "Edit the release, tick 'Set as a pre-release', and publish it again."
                  exit 1
                fi
                ;;
              *)
                if [ "$RELEASE_PRERELEASE" = "true" ]; then
                  echo "::error::v$version is a stable version, but the release is marked as a" \
                       "pre-release. Untick 'Set as a pre-release', or give it a beta version such as" \
                       "$version-beta.1."
                  exit 1
                fi
                ;;
            esac

            echo "artifact_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "building $RELEASE_TAG"
          else
            # A rehearsal off a branch. Naming it after the branch would produce an identical filename on
            # every run and read as though 'master' were a version.
            tag="v$version-dev-$(git rev-parse --short HEAD)"
            echo "artifact_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "rehearsing $tag, nothing will be published"
          fi

  # The release notes are what the app shows admins as What's new, so they must be the changelog written
  # for people running it, not GitHub's generated list of pull request titles. Stable releases were being
  # published with the generated list, so this fills in the changelog section when the notes are empty or
  # generated, and leaves anything written by hand alone. Betas already carry theirs from beta-publish.yml.
  #
  # After the files are attached rather than alongside, because attaching them rewrites the release, and
  # one that read the notes first could put the generated ones back.
  notes:
    name: release notes
    needs: [version, publish]
    runs-on: ubuntu-latest
    if: needs.version.outputs.publish == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Fill in empty or generated notes from the changelog
        env:
          TAG: ${{ needs.version.outputs.artifact_tag }}
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [ -n "$current" ] && ! printf '%s\n' "$current" | grep -qE '^## What.s Changed|^\*\*Full Changelog\*\*'; then
            echo "keeping the notes written on the release"
            exit 0
          fi

          # A beta is published from the unreleased section; a stable version has its own dated one.
          case "$VERSION" in
            *-*) found() { node scripts/version.mjs notes > notes.md; } ;;
            *) found() { node scripts/version.mjs notes "$VERSION" > notes.md; } ;;
          esac
          # Missing notes are worth a warning, not a failed release: the files still matter more.
          if ! found; then
            echo "::warning::CHANGELOG.md has no section for $VERSION, so the release notes were left as they are."
            exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          echo "release notes set from CHANGELOG.md"

  # Built once and shared, so every platform ships byte identical assets rather than four separate builds
  # that merely ought to match.
  ui:
    name: web ui
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: frontend/dist
          retention-days: 1

  binary:
    name: ${{ matrix.target }}
    needs: [version, ui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # Must land before cargo build, because a release build reads this directory at compile time and
      # embeds whatever it finds.
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: frontend/dist

      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Build
        working-directory: backend
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        if: runner.os != 'Windows'
        run: |
          name="on-air-record-${{ needs.version.outputs.artifact_tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "backend/target/${{ matrix.target }}/release/on-air-record" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          # The systemd unit is only useful on Linux, so it does not belong in the macOS archives.
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp packaging/on-air-record.service "dist/$name/"
          fi
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          if command -v sha256sum > /dev/null; then
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "on-air-record-${{ needs.version.outputs.artifact_tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "backend/target/${{ matrix.target }}/release/on-air-record.exe" "dist/$name/"
          Copy-Item "README.md" "dist/$name/"
          Copy-Item "LICENSE" "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    name: attach to the release
    needs: [version, binary]
    runs-on: ubuntu-latest
    # Only a published release gets files attached. A manual rehearsal stops at the artifacts above.
    if: needs.version.outputs.publish == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      # The release already exists, made by hand, so this only uploads the files onto it. It never
      # touches the notes; the notes job above looks after them.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.artifact_tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  # The last word on whether the release is usable: install it the way a person would, on each platform,
  # from the files that were just attached, and check the service comes up.
  #
  # This runs after publishing rather than before, because there is nothing to install until the assets
  # exist. A failure here means the release is already public and broken, which is worth knowing loudly:
  # fix it, delete the release and its tag, and cut it again.
  verify:
    name: verify the install (${{ matrix.os }})
    needs: [version, publish]
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install the ALSA runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install and run this release
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.artifact_tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          work="$RUNNER_TEMP/verify"
          mkdir -p "$work"
          cd "$work"

          # Pinned to the tag rather than resolving "latest", so this cannot quietly test the previous
          # release while GitHub is still catching up.
          sh "$GITHUB_WORKSPACE/scripts/install.sh" --release "$RELEASE_TAG" --port 8099 --no-start

          reported="$(./on-air-record/on-air-record --version | awk '{print $2}')"
          echo "the archive is named $RELEASE_TAG and the binary inside reports $reported"
          if [ "$reported" != "$RELEASE_VERSION" ]; then
            echo "the released binary disagrees with the tag it shipped under"
            exit 1
          fi

          ./on-air-record/start.sh > service.log 2>&1 &
          answered=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8099/api/health -o health.json 2>/dev/null; then answered=1; break; fi
            sleep 1
          done
          pkill -f 'on-air-record/on-air-record' 2>/dev/null || true

          if [ "$answered" -ne 1 ]; then
            echo "the released service never answered"
            cat service.log || true
            exit 1
          fi
          cat health.json; echo
          grep -q "\"version\":\"$RELEASE_VERSION\"" health.json || { echo "health reported the wrong version"; exit 1; }
          echo "release verified end to end on $(uname -s)"

      - name: Install and run this release
        if: runner.os == 'Windows'
        shell: powershell
        env:
          RELEASE_TAG: ${{ needs.version.outputs.artifact_tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'verify'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Set-Location $work

          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\install.ps1" `
            -Release $env:RELEASE_TAG -Port 8099 -NoStart
          if ($LASTEXITCODE -ne 0) { throw "the installer exited with $LASTEXITCODE" }

          $reported = (& '.\on-air-record\on-air-record.exe' --version) -split '\s+' | Select-Object -Last 1
          Write-Host "the archive is named $env:RELEASE_TAG and the binary inside reports $reported"
          if ($reported -ne $env:RELEASE_VERSION) {
            throw "the released binary disagrees with the tag it shipped under"
          }

          $service = Start-Process -FilePath '.\on-air-record\start.cmd' -PassThru -NoNewWindow `
            -RedirectStandardOutput service.log -RedirectStandardError service.err
          $health = $null
          foreach ($attempt in 1..60) {
            try {
              $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8099/api/health' -TimeoutSec 2
              break
            } catch { Start-Sleep -Seconds 1 }
          }
          Stop-Process -Id $service.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'on-air-record' -ErrorAction SilentlyContinue | Stop-Process -Force

          if (-not $health) {
            Get-Content service.log, service.err -ErrorAction SilentlyContinue | Write-Host
            throw 'the released service never answered'
          }
          Write-Host ($health | ConvertTo-Json -Compress)
          if ($health.version -ne $env:RELEASE_VERSION) { throw "health reported the wrong version" }
          Write-Host 'release verified end to end on Windows'
